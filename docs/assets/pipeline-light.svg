<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 316" width="960" height="316" role="img" aria-labelledby="t d"><title id="t">One ticket moving through Botkit</title><desc id="d">Animated diagram. A ticket moves from a brief the human writes, to a spec and tests the human approves, into a throwaway clone where Claude Code builds it. A guard compares git state before and after, the human's tests decide pass or fail, Codex reviews as advice only, and the human explains the change, applies the patch and commits.</desc><style>
    .title { font: 600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .hint { font: 400 12.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #59636e; }
    .name { font: 600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .who { font: 400 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #59636e; }
    .state { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .desc { font: 400 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .tok { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #ffffff; }
    .lane { font: 400 11.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9a6700; }
    .anim { animation-duration: 22.0s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .glow, .cap { opacity: 0; }
    .static { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none !important; }
      .token, .cap { display: none; }
      .static { display: inline; }
    }@keyframes glow_0 { 0.00% { opacity: 1; } 6.00% { opacity: 1; } 7.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_0 { animation-name: glow_0; }@keyframes glow_1 { 0.00% { opacity: 0; } 8.00% { opacity: 0; } 9.50% { opacity: 1; } 19.00% { opacity: 1; } 20.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_1 { animation-name: glow_1; }@keyframes glow_2 { 0.00% { opacity: 0; } 21.00% { opacity: 0; } 22.50% { opacity: 1; } 36.00% { opacity: 1; } 37.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_2 { animation-name: glow_2; }@keyframes glow_3 { 0.00% { opacity: 0; } 38.00% { opacity: 0; } 39.50% { opacity: 1; } 49.00% { opacity: 1; } 50.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_3 { animation-name: glow_3; }@keyframes glow_4 { 0.00% { opacity: 0; } 51.00% { opacity: 0; } 52.50% { opacity: 1; } 62.00% { opacity: 1; } 63.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_4 { animation-name: glow_4; }@keyframes glow_5 { 0.00% { opacity: 0; } 64.00% { opacity: 0; } 65.50% { opacity: 1; } 76.00% { opacity: 1; } 77.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_5 { animation-name: glow_5; }@keyframes glow_6 { 0.00% { opacity: 0; } 78.00% { opacity: 0; } 79.50% { opacity: 1; } 98.00% { opacity: 1; } 99.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_6 { animation-name: glow_6; }@keyframes tokenmove { 0.00% { transform: translate(43.0px, 209.0px); } 6.00% { transform: translate(43.0px, 209.0px); } 9.50% { transform: translate(171.3px, 209.0px); } 19.00% { transform: translate(171.3px, 209.0px); } 22.50% { transform: translate(299.7px, 209.0px); } 36.00% { transform: translate(299.7px, 209.0px); } 39.50% { transform: translate(428.0px, 209.0px); } 49.00% { transform: translate(428.0px, 209.0px); } 52.50% { transform: translate(556.3px, 209.0px); } 62.00% { transform: translate(556.3px, 209.0px); } 65.50% { transform: translate(684.7px, 209.0px); } 76.00% { transform: translate(684.7px, 209.0px); } 79.50% { transform: translate(813.0px, 209.0px); } 98.00% { transform: translate(813.0px, 209.0px); } 100.00% { transform: translate(813.0px, 209.0px); } }@keyframes tokenfade { 0% { opacity: 0; } 2% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }.token { animation-name: tokenmove; }.tokenfade { animation-name: tokenfade; animation-timing-function: linear; }@keyframes cap_0 { 0.00% { opacity: 1; } 8.25% { opacity: 1; } 9.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_0 { animation-name: cap_0; }@keyframes cap_1 { 0.00% { opacity: 0; } 8.25% { opacity: 0; } 9.50% { opacity: 1; } 21.25% { opacity: 1; } 22.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_1 { animation-name: cap_1; }@keyframes cap_2 { 0.00% { opacity: 0; } 21.25% { opacity: 0; } 22.50% { opacity: 1; } 38.25% { opacity: 1; } 39.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_2 { animation-name: cap_2; }@keyframes cap_3 { 0.00% { opacity: 0; } 38.25% { opacity: 0; } 39.50% { opacity: 1; } 51.25% { opacity: 1; } 52.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_3 { animation-name: cap_3; }@keyframes cap_4 { 0.00% { opacity: 0; } 51.25% { opacity: 0; } 52.50% { opacity: 1; } 64.25% { opacity: 1; } 65.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_4 { animation-name: cap_4; }@keyframes cap_5 { 0.00% { opacity: 0; } 64.25% { opacity: 0; } 65.50% { opacity: 1; } 78.25% { opacity: 1; } 79.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_5 { animation-name: cap_5; }@keyframes cap_6 { 0.00% { opacity: 0; } 78.25% { opacity: 0; } 79.50% { opacity: 1; } 98.00% { opacity: 1; } 99.25% { opacity: 0; } 100.00% { opacity: 0; } }.cap_6 { animation-name: cap_6; }</style><rect x="0.5" y="0.5" width="959" height="315" rx="12" fill="#ffffff" stroke="#d0d7de"/><text class="title" x="40" y="42">One ticket moving through Botkit</text><text class="hint" x="920" y="42" text-anchor="end">example run that ends in PASS</text><rect x="287.7" y="76" width="513.0" height="118" rx="12" fill="none" stroke="#9a6700" stroke-width="1.4" stroke-dasharray="5 5"/><text class="lane" x="299.7" y="94">throwaway clone, no remote, runs with no human</text><path d="M153.5 143.0 H164.3 M159.3 139.0 L164.8 143.0 L159.3 147.0" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M281.8 143.0 H292.7 M287.7 139.0 L293.2 143.0 L287.7 147.0" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M410.2 143.0 H421.0 M416.0 139.0 L421.5 143.0 L416.0 147.0" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M538.5 143.0 H549.3 M544.3 139.0 L549.8 143.0 L544.3 147.0" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M666.8 143.0 H677.7 M672.7 139.0 L678.2 143.0 L672.7 147.0" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M795.2 143.0 H806.0 M801.0 139.0 L806.5 143.0 L801.0 147.0" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="40.0" y="104" width="110" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect class="glow anim glow_0" x="40.0" y="104" width="110" height="78" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/><text class="name" x="95.0" y="138" text-anchor="middle">Brief</text><text class="who" x="95.0" y="159" text-anchor="middle">you write it</text><rect x="168.3" y="104" width="110" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect class="glow anim glow_1" x="168.3" y="104" width="110" height="78" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/><text class="name" x="223.3" y="138" text-anchor="middle">Spec + tests</text><text class="who" x="223.3" y="159" text-anchor="middle">you approve</text><rect x="296.7" y="104" width="110" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect class="glow anim glow_2" x="296.7" y="104" width="110" height="78" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/><text class="name" x="351.7" y="138" text-anchor="middle">Build</text><text class="who" x="351.7" y="159" text-anchor="middle">Claude Code</text><rect x="425.0" y="104" width="110" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect class="glow anim glow_3" x="425.0" y="104" width="110" height="78" rx="10" fill="#e6f6ea" stroke="#1a7f37" stroke-width="2"/><text class="name" x="480.0" y="138" text-anchor="middle">Guard</text><text class="who" x="480.0" y="159" text-anchor="middle">git state check</text><rect x="553.3" y="104" width="110" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect class="glow anim glow_4" x="553.3" y="104" width="110" height="78" rx="10" fill="#e6f6ea" stroke="#1a7f37" stroke-width="2"/><text class="name" x="608.3" y="138" text-anchor="middle">Test</text><text class="who" x="608.3" y="159" text-anchor="middle">your tests</text><rect x="681.7" y="104" width="110" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect class="glow anim glow_5" x="681.7" y="104" width="110" height="78" rx="10" fill="#eef0ff" stroke="#4f46e5" stroke-width="2"/><text class="name" x="736.7" y="138" text-anchor="middle">Review</text><text class="who" x="736.7" y="159" text-anchor="middle">Codex advises</text><rect x="810.0" y="104" width="110" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de"/><rect class="glow anim glow_6" x="810.0" y="104" width="110" height="78" rx="10" fill="#e6f6ea" stroke="#1a7f37" stroke-width="2"/><text class="name" x="865.0" y="138" text-anchor="middle">Merge</text><text class="who" x="865.0" y="159" text-anchor="middle">you commit</text><path d="M95.0 222 H865.0" stroke="#d0d7de" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/><g class="anim tokenfade"><g class="token anim" style="transform: translate(43.0px, 209.0px)"><rect width="104" height="26" rx="13" fill="#1f2328"/><text class="tok" x="52.0" y="17" text-anchor="middle">ticket T012</text></g></g><path d="M40 258 H920" stroke="#d0d7de" stroke-width="1"/><g class="cap anim cap_0"><circle cx="46" cy="281" r="5" fill="#4f46e5"/><text x="60" y="286"><tspan class="state" fill="#4f46e5">BRIEF</tspan><tspan class="desc" dx="12">you write the goal and a few examples</tspan></text></g><g class="cap anim cap_1"><circle cx="46" cy="281" r="5" fill="#4f46e5"/><text x="60" y="286"><tspan class="state" fill="#4f46e5">SPEC</tspan><tspan class="desc" dx="12">Claude drafts the spec and failing tests. You approve them</tspan></text></g><g class="cap anim cap_2"><circle cx="46" cy="281" r="5" fill="#4f46e5"/><text x="60" y="286"><tspan class="state" fill="#4f46e5">BUILD</tspan><tspan class="desc" dx="12">Claude Code builds in a throwaway clone that cannot push</tspan></text></g><g class="cap anim cap_3"><circle cx="46" cy="281" r="5" fill="#1a7f37"/><text x="60" y="286"><tspan class="state" fill="#1a7f37">GUARD</tspan><tspan class="desc" dx="12">git state compared before and after. Nothing moved</tspan></text></g><g class="cap anim cap_4"><circle cx="46" cy="281" r="5" fill="#1a7f37"/><text x="60" y="286"><tspan class="state" fill="#1a7f37">VERIFY</tspan><tspan class="desc" dx="12">your tests are restored from the base commit, then run. Green</tspan></text></g><g class="cap anim cap_5"><circle cx="46" cy="281" r="5" fill="#4f46e5"/><text x="60" y="286"><tspan class="state" fill="#4f46e5">REVIEW</tspan><tspan class="desc" dx="12">Codex reads the brief, the spec and the patch. Advice only</tspan></text></g><g class="cap anim cap_6"><circle cx="46" cy="281" r="5" fill="#1a7f37"/><text x="60" y="286"><tspan class="state" fill="#1a7f37">PASS</tspan><tspan class="desc" dx="12">you explain the change, apply the patch, then commit and push</tspan></text></g><text class="desc static" x="40" y="286">Brief, spec and tests, build in a clone, guard, tests, review, then you merge. Bots never commit or push.</text></svg>