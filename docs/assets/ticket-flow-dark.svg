<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="t d"><title id="t">One ticket moving through Botkit</title><desc id="d">Animated diagram. A ticket moves from Spec to Build, where Claude writes the code. A test fails, so the ticket returns to Build for one retry. The tests then pass, ChatGPT reviews the spec and the diff and returns PASS, the human reads the diff and commits, and the ticket is approved.</desc><style>
    .title { font: 600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .hint { font: 400 12.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .name { font: 600 15px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .who { font: 400 12px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .state { font: 700 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .desc { font: 400 14px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .tok { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #0d1117; }
    .lane { font: 400 11.5px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .anim { animation-duration: 20.0s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .glow, .cap { opacity: 0; }
    .static { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none !important; }
      .token, .cap { display: none; }
      .static { display: inline; }
    }@keyframes glow_0_accent { 0.00% { opacity: 1; } 6.00% { opacity: 1; } 7.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_0_accent { animation-name: glow_0_accent; }@keyframes glow_1_accent { 0.00% { opacity: 0; } 8.50% { opacity: 0; } 10.00% { opacity: 1; } 20.00% { opacity: 1; } 21.50% { opacity: 0; } 37.50% { opacity: 0; } 39.00% { opacity: 1; } 47.00% { opacity: 1; } 48.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_1_accent { animation-name: glow_1_accent; }@keyframes glow_2_bad { 0.00% { opacity: 0; } 22.50% { opacity: 0; } 24.00% { opacity: 1; } 31.00% { opacity: 1; } 32.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_2_bad { animation-name: glow_2_bad; }@keyframes glow_2_ok { 0.00% { opacity: 0; } 49.50% { opacity: 0; } 51.00% { opacity: 1; } 57.00% { opacity: 1; } 58.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_2_ok { animation-name: glow_2_ok; }@keyframes glow_3_ok { 0.00% { opacity: 0; } 59.50% { opacity: 0; } 61.00% { opacity: 1; } 71.00% { opacity: 1; } 72.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_3_ok { animation-name: glow_3_ok; }@keyframes glow_4_accent { 0.00% { opacity: 0; } 73.50% { opacity: 0; } 75.00% { opacity: 1; } 85.00% { opacity: 1; } 86.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_4_accent { animation-name: glow_4_accent; }@keyframes glow_5_ok { 0.00% { opacity: 0; } 87.50% { opacity: 0; } 89.00% { opacity: 1; } 98.00% { opacity: 1; } 99.50% { opacity: 0; } 100.00% { opacity: 0; } }.glow_5_ok { animation-name: glow_5_ok; }@keyframes tokenmove { 0.00% { transform: translate(36.0px, 193.0px); } 6.00% { transform: translate(36.0px, 193.0px); } 10.00% { transform: translate(188.0px, 193.0px); } 20.00% { transform: translate(188.0px, 193.0px); } 24.00% { transform: translate(340.0px, 193.0px); } 31.00% { transform: translate(340.0px, 193.0px); } 33.00% { transform: translate(340.0px, 239.0px); } 37.00% { transform: translate(188.0px, 239.0px); } 39.00% { transform: translate(188.0px, 193.0px); } 47.00% { transform: translate(188.0px, 193.0px); } 51.00% { transform: translate(340.0px, 193.0px); } 57.00% { transform: translate(340.0px, 193.0px); } 61.00% { transform: translate(492.0px, 193.0px); } 71.00% { transform: translate(492.0px, 193.0px); } 75.00% { transform: translate(644.0px, 193.0px); } 85.00% { transform: translate(644.0px, 193.0px); } 89.00% { transform: translate(796.0px, 193.0px); } 98.00% { transform: translate(796.0px, 193.0px); } 100.00% { transform: translate(796.0px, 193.0px); } }
@keyframes tokenfade { 0% { opacity: 0; } 2% { opacity: 1; } 97% { opacity: 1; } 100% { opacity: 0; } }.token { animation-name: tokenmove; }.tokenfade { animation-name: tokenfade; animation-timing-function: linear; }@keyframes cap_0 { 0.00% { opacity: 1; } 8.25% { opacity: 1; } 9.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_0 { animation-name: cap_0; }@keyframes cap_1 { 0.00% { opacity: 0; } 8.75% { opacity: 0; } 10.00% { opacity: 1; } 22.25% { opacity: 1; } 23.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_1 { animation-name: cap_1; }@keyframes cap_2 { 0.00% { opacity: 0; } 22.75% { opacity: 0; } 24.00% { opacity: 1; } 30.75% { opacity: 1; } 32.00% { opacity: 0; } 100.00% { opacity: 0; } }.cap_2 { animation-name: cap_2; }@keyframes cap_3 { 0.00% { opacity: 0; } 31.25% { opacity: 0; } 32.50% { opacity: 1; } 49.25% { opacity: 1; } 50.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_3 { animation-name: cap_3; }@keyframes cap_4 { 0.00% { opacity: 0; } 49.75% { opacity: 0; } 51.00% { opacity: 1; } 59.25% { opacity: 1; } 60.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_4 { animation-name: cap_4; }@keyframes cap_5 { 0.00% { opacity: 0; } 59.75% { opacity: 0; } 61.00% { opacity: 1; } 73.25% { opacity: 1; } 74.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_5 { animation-name: cap_5; }@keyframes cap_6 { 0.00% { opacity: 0; } 73.75% { opacity: 0; } 75.00% { opacity: 1; } 87.25% { opacity: 1; } 88.50% { opacity: 0; } 100.00% { opacity: 0; } }.cap_6 { animation-name: cap_6; }@keyframes cap_7 { 0.00% { opacity: 0; } 87.75% { opacity: 0; } 89.00% { opacity: 1; } 98.00% { opacity: 1; } 99.25% { opacity: 0; } 100.00% { opacity: 0; } }.cap_7 { animation-name: cap_7; }</style><rect x="0.5" y="0.5" width="959" height="379" rx="12" fill="#0d1117" stroke="#30363d"/><text class="title" x="40" y="42">One ticket moving through Botkit</text><text class="hint" x="920" y="42" text-anchor="end">example run with one failed test and one retry</text><path d="M166 131.0 H181 M176 126.5 L182 131.0 L176 135.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M318 131.0 H333 M328 126.5 L334 131.0 L328 135.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M470 131.0 H485 M480 126.5 L486 131.0 L480 135.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M622 131.0 H637 M632 126.5 L638 131.0 L632 135.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M774 131.0 H789 M784 126.5 L790 131.0 L784 135.5" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="92" width="120" height="78" rx="10" fill="#161b22" stroke="#30363d"/><rect class="glow anim glow_0_accent" x="40" y="92" width="120" height="78" rx="10" fill="#1c1f3d" stroke="#8b93ff" stroke-width="2"/><text class="name" x="100.0" y="126" text-anchor="middle">Spec</text><text class="who" x="100.0" y="147" text-anchor="middle">you write it</text><rect x="192" y="92" width="120" height="78" rx="10" fill="#161b22" stroke="#30363d"/><rect class="glow anim glow_1_accent" x="192" y="92" width="120" height="78" rx="10" fill="#1c1f3d" stroke="#8b93ff" stroke-width="2"/><text class="name" x="252.0" y="126" text-anchor="middle">Build</text><text class="who" x="252.0" y="147" text-anchor="middle">Claude</text><rect x="344" y="92" width="120" height="78" rx="10" fill="#161b22" stroke="#30363d"/><rect class="glow anim glow_2_bad" x="344" y="92" width="120" height="78" rx="10" fill="#2d1416" stroke="#f85149" stroke-width="2"/><rect class="glow anim glow_2_ok" x="344" y="92" width="120" height="78" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="2"/><text class="name" x="404.0" y="126" text-anchor="middle">Test</text><text class="who" x="404.0" y="147" text-anchor="middle">pytest</text><rect x="496" y="92" width="120" height="78" rx="10" fill="#161b22" stroke="#30363d"/><rect class="glow anim glow_3_ok" x="496" y="92" width="120" height="78" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="2"/><text class="name" x="556.0" y="126" text-anchor="middle">Review</text><text class="who" x="556.0" y="147" text-anchor="middle">ChatGPT</text><rect x="648" y="92" width="120" height="78" rx="10" fill="#161b22" stroke="#30363d"/><rect class="glow anim glow_4_accent" x="648" y="92" width="120" height="78" rx="10" fill="#1c1f3d" stroke="#8b93ff" stroke-width="2"/><text class="name" x="708.0" y="126" text-anchor="middle">Hand off</text><text class="who" x="708.0" y="147" text-anchor="middle">you read the diff</text><rect x="800" y="92" width="120" height="78" rx="10" fill="#161b22" stroke="#30363d"/><rect class="glow anim glow_5_ok" x="800" y="92" width="120" height="78" rx="10" fill="#12261a" stroke="#3fb950" stroke-width="2"/><text class="name" x="860.0" y="126" text-anchor="middle">Approved</text><text class="who" x="860.0" y="147" text-anchor="middle">you commit</text><path d="M100.0 206 H860.0" stroke="#30363d" stroke-width="2" stroke-linecap="round" stroke-dasharray="1 7"/><path d="M404.0 214 V240 Q404.0 252 392.0 252 H264.0 Q252.0 252 252.0 240 V218" fill="none" stroke="#d29922" stroke-width="1.6" stroke-dasharray="5 5" stroke-linecap="round"/><path d="M247.5 224 L252.0 217 L256.5 224" fill="none" stroke="#d29922" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text class="lane" x="328.0" y="288" text-anchor="middle" fill="#d29922">tests fail or review fails: retry, capped at 2</text><g class="anim tokenfade"><g class="token anim" style="transform: translate(36.0px, 193.0px)"><rect width="128" height="26" rx="13" fill="#e6edf3"/><text class="tok" x="64.0" y="17" text-anchor="middle">ticket a1b2c3d4</text></g></g><path d="M40 318 H920" stroke="#30363d" stroke-width="1"/><g class="cap anim cap_0"><circle cx="46" cy="341" r="5" fill="#8b93ff"/><text x="60" y="346"><tspan class="state" fill="#8b93ff">SUBMITTED → VALIDATED</tspan><tspan class="desc" dx="12">the spec has every required field</tspan></text></g><g class="cap anim cap_1"><circle cx="46" cy="341" r="5" fill="#8b93ff"/><text x="60" y="346"><tspan class="state" fill="#8b93ff">BUILDING</tspan><tspan class="desc" dx="12">Claude writes the code in its own git worktree</tspan></text></g><g class="cap anim cap_2"><circle cx="46" cy="341" r="5" fill="#f85149"/><text x="60" y="346"><tspan class="state" fill="#f85149">TESTING</tspan><tspan class="desc" dx="12">a visible test fails</tspan></text></g><g class="cap anim cap_3"><circle cx="46" cy="341" r="5" fill="#8b93ff"/><text x="60" y="346"><tspan class="state" fill="#8b93ff">RETRYING → BUILDING</tspan><tspan class="desc" dx="12">the failing output goes back to the builder (retry 1 of 2)</tspan></text></g><g class="cap anim cap_4"><circle cx="46" cy="341" r="5" fill="#3fb950"/><text x="60" y="346"><tspan class="state" fill="#3fb950">TESTING</tspan><tspan class="desc" dx="12">every visible test passes</tspan></text></g><g class="cap anim cap_5"><circle cx="46" cy="341" r="5" fill="#3fb950"/><text x="60" y="346"><tspan class="state" fill="#3fb950">REVIEWING</tspan><tspan class="desc" dx="12">ChatGPT sees only the spec and the diff. Verdict: PASS</tspan></text></g><g class="cap anim cap_6"><circle cx="46" cy="341" r="5" fill="#8b93ff"/><text x="60" y="346"><tspan class="state" fill="#8b93ff">AWAITING_HUMAN</tspan><tspan class="desc" dx="12">you read the diff and the review, then commit</tspan></text></g><g class="cap anim cap_7"><circle cx="46" cy="341" r="5" fill="#3fb950"/><text x="60" y="346"><tspan class="state" fill="#3fb950">APPROVED</tspan><tspan class="desc" dx="12">the commit is yours. Bots never commit or push</tspan></text></g><text class="desc static" x="40" y="346">Spec, build, test, review, hand off, approve. A failed test or review sends the ticket back to the builder, at most twice.</text></svg>